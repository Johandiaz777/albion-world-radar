name: scan
# Escáner de mercado de Albion World. Igual que el scraper de kills: un job que vive ~5h40m y
# escanea cada 30 min (en :07 y :37), y al terminar se re-lanza solo para correr 24/7 sin depender
# del cron de GitHub (que se atrasa 10-30 min). El cron de abajo es solo la red de seguridad por si la
# cadena se corta.
#
# Publicación: las ramas `data` (lo que lee la app) y `state` (promedios de 30 días) son UN solo
# commit que se reescribe con push -f. No hay pull, rebase ni merge en ningún paso, así que es
# imposible que un marcador de conflicto termine dentro de un .json (lo que mató los precios del
# otro repo 8 semanas), y el repositorio no crece.
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: {}

concurrency:
  group: scan-loop
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas del análisis
        run: npm test

      - name: Escanear cada 30 min durante ~5h40m
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -u
          date +%s > /tmp/loop-start
          END=$((SECONDS + 20400))

          # Trae la última publicación de una rama a una carpeta (vacía si la rama aún no existe).
          traer() {
            rm -rf "$2"
            if ! git clone -q --depth 1 -b "$1" "$REPO_URL" "$2" 2>/dev/null; then mkdir -p "$2"; fi
            rm -rf "$2/.git"
          }

          # Publica una carpeta como UN commit en su rama (push -f: sin historial, sin conflictos).
          # Devuelve 1 si no se publicó (auditoría p86 R1: antes se tragaba el fallo y quien llamaba daba
          # por subido lo que no subió).
          publicar() {
            if grep -rlI -e '^<<<<<<< ' -e '^>>>>>>> ' "$2" >/dev/null 2>&1; then
              echo "::error::marcadores de conflicto en $2: no se publica"; return 1
            fi
            if (
              cd "$2" && rm -rf .git && git init -q -b "$1" \
              && git config user.name "radar-scan" \
              && git config user.email "radar-scan@users.noreply.github.com" \
              && git add -A && git commit -q -m "$1 $(date -u +%FT%TZ)" \
              && git push -q -f "$REPO_URL" "$1"
            ); then return 0; fi
            echo "::warning::push de $1 falló; se reintenta en la próxima vuelta"; return 1
          }

          # Historial diario: rama `history` que SOLO agrega archivos (uno por día y región, ~150 KB),
          # con commits normales. Un solo escritor (grupo de concurrencia), así que el push siempre
          # avanza sin pull ni rebase; si alguna vez lo rechazan, se reintenta en la próxima vuelta.
          # El escáner solo AGREGA archivos acá (nunca lee los viejos): se clona sin contenido (sin blobs
          # y con checkout disperso vacío), así cada ciclo baja casi nada aunque la rama crezca todo el
          # año (auditoría A2). Los archivos viejos siguen en el índice y en la rama.
          # Tres intentos: sin la rama traída el push del historial no avanza y `state` no se publica en todo
          # el ciclo (abajo), así que un corte de red al arrancar no debe costar 5 horas.
          rm -rf history
          for intento in 1 2 3; do
            if git clone -q --depth 1 --filter=blob:none --no-checkout -b history "$REPO_URL" history 2>/dev/null; then break; fi
            rm -rf history; [ "$intento" = 3 ] || sleep 15
          done
          if [ -d history/.git ]; then
            git -C history sparse-checkout set --no-cone '/.sin-archivos' && git -C history checkout -q history
          else
            if git ls-remote --exit-code --heads "$REPO_URL" history >/dev/null 2>&1; then
              echo "::warning::no se pudo traer la rama history: este ciclo no publica state (el próximo vuelve a escribir esos días)"
            fi
            mkdir -p history && git -C history init -q -b history
          fi
          git -C history config user.name "radar-scan"
          git -C history config user.email "radar-scan@users.noreply.github.com"
          # Un commit del historial que todavía no se subió se reintenta aunque no haya archivos nuevos
          # (auditoría p86 R4: antes esperaba al día siguiente). Devuelve 1 mientras quede algo sin subir.
          HIST_PENDING=0
          publicar_historial() {
            if [ -n "$(git -C history status --porcelain)" ]; then
              if git -C history add --sparse -A && git -C history commit -q -m "historial $(date -u +%F)"; then
                HIST_PENDING=1
              else
                echo "::warning::no se pudo armar el commit del historial"; return 1
              fi
            fi
            [ "$HIST_PENDING" = 1 ] || return 0
            if git -C history push -q "$REPO_URL" HEAD:history; then HIST_PENDING=0; return 0; fi
            echo "::warning::push del historial falló; se reintenta en la próxima vuelta"; return 1
          }

          traer data out
          traer state state

          # Precios publicados por día (rama `listings`, un archivo por ítem, se reescribe con push -f
          # como data/state). Solo se escribe/publica si se pudo traer la rama o si todavía no existe:
          # publicar una carpeta vacía borraría el historial acumulado.
          rm -rf listings
          if git clone -q --depth 1 -b listings "$REPO_URL" listings 2>/dev/null; then
            rm -rf listings/.git; export LISTINGS_READY=1
          elif ! git ls-remote --exit-code --heads "$REPO_URL" listings >/dev/null 2>&1; then
            mkdir -p listings; export LISTINGS_READY=1
          else
            echo "::warning::no se pudo traer la rama listings: los días cerrados esperan en el estado"
            export LISTINGS_READY=0
          fi
          # Solo se publica cuando el escáner escribió algo (una vez por día), no en cada vuelta: la
          # marca se toca al traer la rama, así lo recién clonado no se vuelve a subir entero. La marca
          # avanza SOLO si el push salió (auditoría p86 R1: antes avanzaba antes y un push fallido no se
          # reintentaba nunca). Devuelve 1 si quedó algo sin subir.
          touch /tmp/listings-stamp
          publicar_listings() {
            [ "${LISTINGS_READY:-0}" = 1 ] || return 0
            if [ -n "$(find listings -type f -newer /tmp/listings-stamp 2>/dev/null | head -1)" ]; then
              touch /tmp/listings-stamp.next
              publicar listings listings || return 1
              mv /tmp/listings-stamp.next /tmp/listings-stamp
            fi
          }

          # Vuelta completa en :07 y :37 (todo el catálogo); vuelta rápida en :17, :27, :47 y :57 (los
          # más buscados de cada servidor + lo que el Radar ya muestra, mezclado con la última tabla
          # completa). La primera vuelta del ciclo siempre es completa.
          MODO=full
          while [ "$SECONDS" -lt "$END" ]; do
            if [ "$MODO" = full ]; then
              if node scan.mjs; then
                # `|| :` en las llamadas sueltas: el paso corre con `bash -e` y un push fallido no debe cortar el
                # ciclo (el aviso ya sale de `publicar` y la próxima vuelta reintenta).
                publicar data out || :
                # Orden (auditoría p86 R1/R2): primero lo que solo se agrega (historial y precios publicados)
                # y después `state`, que ya los da por escritos (borró esos días de su buffer). Si alguno no
                # subió, `state` espera: la próxima vuelta lo reintenta y, si el ciclo muere antes, el siguiente
                # parte del `state` anterior y vuelve a escribir esos días (escribirlos dos veces da lo mismo).
                ok=1
                publicar_historial || ok=0
                publicar_listings || ok=0
                if [ "$ok" = 1 ]; then
                  publicar state state || :
                else
                  echo "::warning::state no se publica en esta vuelta: falta subir historial o precios publicados"
                fi
              else
                echo "::warning::las 3 regiones fallaron en esta vuelta; se sigue con la siguiente"
              fi
            else
              if node scan.mjs --quick; then
                publicar data out || :
              else
                echo "::warning::vuelta rápida sin resultado; se sigue"
              fi
            fi
            # Duerme hasta el próximo :x7 (UTC); :07 y :37 son completas.
            MIN=$((10#$(date -u +%M))); SEC=$((10#$(date -u +%S)))
            NEXT=$(( (MIN / 10) * 10 + 7 )); [ "$NEXT" -le "$MIN" ] && NEXT=$((NEXT + 10))
            WAIT=$(( (NEXT - MIN) * 60 - SEC ))
            if [ $(( NEXT % 30 )) -eq 7 ]; then MODO=full; else MODO=quick; fi
            [ $((SECONDS + WAIT)) -ge "$END" ] && break
            sleep "$WAIT"
          done

      - name: Encadenar el siguiente ciclo
        if: always()
        run: |
          # Si el bucle murió enseguida (pruebas rotas, AODP caído), no se encadena: re-lanzarse
          # cada minuto sería un bucle infinito de corridas. El cron de 4 h lo retoma.
          S=$(cat /tmp/loop-start 2>/dev/null || echo 0)
          if [ $(( $(date +%s) - S )) -lt 1800 ]; then echo "vuelta corta: no se encadena"; exit 0; fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scan.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
